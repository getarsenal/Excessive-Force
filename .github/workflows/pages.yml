name: Deploy to GitHub Pages

on:
  push:
    # main only. Setting the Pages source to GitHub Actions restricts the
    # github-pages environment to the default branch, so a run from any other
    # branch builds fine and is then refused at the deploy step — listing one
    # here just produces a failed run on every push.
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Pages must already be enabled for the repository, with its source set
      # to GitHub Actions (Settings -> Pages -> Build and deployment).
      # `enablement: true` does not work here: creating a Pages site needs repo
      # admin rights, which the workflow's GITHUB_TOKEN does not have, and the
      # attempt fails with "Resource not accessible by integration".
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
