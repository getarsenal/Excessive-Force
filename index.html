<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>EXCESSIVE FORCE</title>
<meta name="description" content="Bring down the world's landmarks, one stone at a time. A 3D artillery demolition game — Big Ben, the Eiffel Tower, the Taj Mahal and the Pyramids, on their real ground.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Excessive Force">
<meta name="theme-color" content="#0b0d10">
<link rel="icon" type="image/png" sizes="64x64" href="./favicon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<link rel="manifest" href="./site.webmanifest">
<!-- What a shared link unfurls into. Absolute, because a card fetcher has no
     idea where a relative path points. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Excessive Force">
<meta property="og:title" content="Excessive Force">
<meta property="og:description" content="Bring down the world's landmarks, one stone at a time. Big Ben, the Eiffel Tower, the Taj Mahal and the Pyramids — real ground, real masonry, your artillery.">
<meta property="og:url" content="https://getarsenal.app/">
<meta property="og:image" content="https://getarsenal.app/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Excessive Force — the Taj Mahal coming apart under artillery fire">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Excessive Force">
<meta name="twitter:description" content="Bring down the world's landmarks, one stone at a time.">
<meta name="twitter:image" content="https://getarsenal.app/og.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./src/ui/style.css">
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <div id="loading">
    <div class="load-inner">
      <img class="load-logo" src="./logo-512.png" alt="Excessive Force" width="512" height="512" decoding="async">
      <div class="load-title">EXCESSIVE FORCE</div>
      <div class="load-sub">WESTMINSTER · LONDON</div>
      <div class="load-bar"><div class="load-fill" id="load-fill"></div></div>
      <div class="load-status" id="load-status">initialising</div>
    </div>
  </div>

  <div id="ui" hidden>
    <!-- Top bar -->
    <header id="topbar">
      <div class="tb-block">
        <div class="tb-label">FUNDS</div>
        <div class="tb-value money" id="hud-money">$0</div>
      </div>
      <div class="tb-block">
        <div class="tb-label">INCOME</div>
        <div class="tb-value" id="hud-income">$0/s</div>
      </div>
      <div class="tb-center">
        <div class="tb-target-name" id="hud-target">ELIZABETH TOWER</div>
        <div class="integrity-wrap">
          <div class="integrity-bar"><div class="integrity-fill" id="hud-integrity"></div><div class="integrity-ticks" id="hud-ticks"></div></div>
          <div class="integrity-pct" id="hud-integrity-pct">100%</div>
        </div>
        <div class="tb-meta">
          <div class="tb-sub" id="hud-height">96.3 m standing</div>
          <div class="objectives" id="hud-objectives"></div>
        </div>
      </div>
      <div class="tb-block right">
        <div class="tb-label">DEFENDERS</div>
        <div class="tb-value danger" id="hud-defenders">0</div>
      </div>
      <div class="tb-block right">
        <div class="tb-label">UNITS</div>
        <div class="tb-value" id="hud-units">0</div>
      </div>
    </header>

    <!-- Unit purchase bar -->
    <nav id="buildbar"></nav>

    <!-- Contextual prompt -->
    <div id="prompt" hidden></div>

    <!-- Selected-target readout -->
    <div id="targetcard" hidden>
      <div class="tc-title">DESIGNATED TARGET</div>
      <div class="tc-row"><span>Section</span><b id="tc-section">—</b></div>
      <div class="tc-row"><span>Height</span><b id="tc-height">—</b></div>
      <div class="tc-row"><span>Guns on target</span><b id="tc-guns">0</b></div>
      <div class="tc-modes" id="tc-modes">
        <button data-mode="point" title="Every gun converges on the point">POINT</button>
        <button data-mode="area" title="The sheaf is walked over the area around it">AREA</button>
        <button data-mode="delay" title="Shells burst inside the stone, not on it">DELAY</button>
      </div>
      <button id="tc-clear">CLEAR</button>
    </div>

    <button id="smoke-btn" title="Lay a smoke screen the garrison cannot see through">SMOKE $120</button>

    <button id="menu-btn">MENU</button>
    <div id="menu" hidden>
      <div class="menu-inner">
        <div class="menu-title">PAUSED</div>
        <div class="menu-grid">
          <button id="menu-resume">RESUME</button>
          <button id="menu-sound">SOUND: ON</button>
          <button id="menu-restart">RESTART</button>
          <button id="menu-targets">ALL TARGETS</button>
        </div>
        <div class="menu-label">QUALITY · reloads the level</div>
        <div class="menu-grid quality">
          <button data-quality="low">LOW</button>
          <button data-quality="medium">MEDIUM</button>
          <button data-quality="high">HIGH</button>
          <button data-quality="ultra">ULTRA</button>
        </div>
        <div class="menu-label">KEYS</div>
        <div class="menu-keys">
          <span><b>1–9</b> pick a unit</span><span><b>Esc</b> cancel</span>
          <span><b>P</b> pause</span><span><b>drag</b> orbit · <b>wheel</b> zoom</span>
        </div>
      </div>
    </div>

    <!-- Perf / debug readout -->
    <div id="perf"></div>

    <button id="targets-btn">TARGETS</button>

    <button id="sound-toggle">SOUND ON</button>

    <!-- Kill feed -->
    <div id="feed"></div>

    <!-- End-of-level -->
    <div id="endcard" hidden>
      <div class="ec-inner">
        <div class="ec-title" id="ec-title">TOWER DOWN</div>
        <div class="ec-sub" id="ec-sub"></div>
        <div class="ec-stats" id="ec-stats"></div>
        <div class="ec-buttons">
          <button id="ec-keep">KEEP GOING</button>
          <button id="ec-next">NEXT TARGET</button>
          <button id="ec-again">RUN IT AGAIN</button>
          <button id="ec-targets">ALL TARGETS</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
